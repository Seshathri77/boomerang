
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boomerang Orchard</title>
    <meta name="description" content="A vibrant fruit-cutting adventure where you throw boomerangs to harvest fruits in a beautiful orchard. Master the art of the return throw across multiple challenging levels.">
    <meta property="og:title" content="Boomerang Orchard">
    <meta property="og:description" content="A vibrant fruit-cutting adventure where you throw boomerangs to harvest fruits in a beautiful orchard. Master the art of the return throw across multiple challenging levels.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6cee2b",
                        "primary-dark": "#4db81c",
                        "background-light": "#f6f8f6",
                        "background-dark": "#162210",
                        "fruit-red": "#ff4d4d",
                        "fruit-yellow": "#ffcc00",
                        "fruit-purple": "#a64dff",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    animation: {
                        'bounce-slight': 'bounce-slight 2s infinite ease-in-out',
                        'spin-fast': 'spin 0.2s linear infinite',
                    },
                    keyframes: {
                        'bounce-slight': {
                            '0%, 100%': { transform: 'translateY(-2%)' },
                            '50%': { transform: 'translateY(0)' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f6f8f6;
            font-family: 'Be Vietnam Pro', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #root {
            height: 100vh;
            width: 100vw;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
        }
        .game-btn {
            transition: all 0.1s;
            box-shadow: 0 6px 0 0 #4db81c;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 #4db81c;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-light dark:bg-background-dark">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
